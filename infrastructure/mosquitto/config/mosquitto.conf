# Eclipse Mosquitto configuration for local WeatherGrid development.
#
# DEVELOPMENT ONLY: this configuration allows anonymous MQTT connections on
# the loopback-bound listener below. Anonymous access is acceptable here only
# because the broker port is bound to 127.0.0.1 (see docker-compose.yml) and
# is never exposed on the container's other interfaces or to the public
# internet. Production deployments MUST configure username/password
# authentication (see `password_file`, commented below) and TLS before the
# broker is reachable from anywhere other than localhost.

listener 1883
# Bind loopback-only at the Docker host level via the compose port mapping
# (`127.0.0.1:1883:1883`); Mosquitto itself listens on all interfaces inside
# its own container network namespace, which is fine since the container
# port is not published beyond loopback.

allow_anonymous true

# To enable authentication instead of anonymous access, generate a password
# file with `mosquitto_passwd -c /mosquitto/config/passwd <username>`, set
# `allow_anonymous false`, and uncomment the line below:
# password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

connection_messages true
